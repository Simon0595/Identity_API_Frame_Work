# Same checks as local: ruff, mypy, makemigrations --check, pytest --cov=core,
# plus a gitleaks secret scan. Any failing step fails the build.
name: CI

on:
  push:
  pull_request:

# Tests mint HS256 JWTs via the local issuer. Do not inherit COGNITO_* / AUTH_ISSUER
# from a developer shell or fork. That would 401 every integration test.
env:
  DJANGO_SETTINGS_MODULE: config.settings.test
  SECRET_KEY: test-only-not-for-production
  AUTH_ISSUER: local

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0 # gitleaks needs full history on pull requests

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy .

      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

      - name: Pytest with coverage
        run: pytest -q --cov=core --cov-fail-under=85

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Static security scan (bandit)
        run: bandit -q -r config core domain domain2

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Demo SPA: build, lint, types, unit tests, npm audit.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Dependency vulnerability scan (npm audit)
        run: npm audit --omit=dev --audit-level=high

  # Prove the Dockerfile builds. No push, no secrets in the image.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Build image
        run: docker build -t api-web-framework:ci .

  # Full stack smoke: Postgres migrations, /health/, non-root, authenticated read.
  docker-compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Compose env (ephemeral CI values, not real credentials)
        run: |
          cat > .env <<'EOF'
          SECRET_KEY=ci-compose-test-only-secret-key-not-for-production
          POSTGRES_PASSWORD=ci-compose-postgres-password-not-for-production
          EOF

      - name: Start stack
        run: docker compose up --build -d

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health/ | grep -q '"status":"ok"'; then
              echo "Health OK"
              exit 0
            fi
            sleep 2
          done
          docker compose logs web
          exit 1

      - name: Verify migrations against Postgres
        run: |
          docker compose logs web 2>&1 | grep -E 'Applying|No migrations to apply'

      - name: Verify non-root runtime
        run: |
          docker compose exec -T web id | grep -q 'uid=1000(app)'

      - name: Verify read path (seed + authenticated GET)
        run: |
          docker compose exec -T web python manage.py seed
          # --no-imports: Django 5.2 shell prints an auto-import banner to stdout that
          # would otherwise be captured into TOKEN and corrupt the Authorization header.
          TOKEN=$(docker compose exec -T web python manage.py shell --no-imports -c \
            "from core.auth.testing import mint_test_token; print(mint_test_token(role='colleague'), end='')")
          curl -sf -H "Authorization: Bearer ${TOKEN}" \
            "http://127.0.0.1:8000/api/v1/identities/11111111-1111-4111-8111-111111111111?context=professional" \
            | grep -q given_name

      - name: Tear down
        if: always()
        run: docker compose down -v
